<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — eggTrace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen">

<div class="min-h-screen flex items-center justify-center p-6">

  <!-- Login Card -->
  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">eggTrace</h1>
      <p class="text-gray-600">Poultry Operations Platform</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white rounded-lg shadow-lg border border-gray-200 p-8">

      <div class="mb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-1">Login</h2>
        <p class="text-sm text-gray-500">Enter your credentials to access the system</p>
      </div>

      <form class="space-y-5">

        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
            Username
          </label>
          <input
            type="text"
            id="username"
            name="username"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Enter username"
            required
          >
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Enter password"
            required
          >
        </div>

        <!-- Role Selection -->
        <div>
          <label for="role" class="block text-sm font-medium text-gray-700 mb-1">
            Role
          </label>
          <select
            id="role"
            name="role"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white"
            required
          >
            <option value="">Select your role</option>
            <option value="supervisor">Supervisor</option>
            <option value="operator">Operator</option>
            <option value="quality">Quality Control</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        <!-- Role Badge Display (shown when role selected) -->
        <div id="roleBadge" class="hidden">
          <div class="flex items-center gap-2 p-3 bg-blue-50 border border-blue-200 rounded-lg">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span class="text-sm font-medium text-blue-800" id="roleBadgeText"></span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-sm hover:shadow-md"
        >
          Sign In
        </button>

      </form>

      <!-- Footer Links -->
      <div class="mt-6 pt-6 border-t border-gray-200 text-center">
        <a href="#" class="text-sm text-gray-600 hover:text-gray-800">
          Need help accessing your account?
        </a>
      </div>

    </div>

    <!-- System Info -->
    <div class="mt-6 text-center text-xs text-gray-500">
      <p>eggTrace — Poultry Operations Platform v2.1</p>
      <p class="mt-1">Secure industrial access portal</p>
    </div>

  </div>

</div>

<script>
  // Show role badge when role is selected
  const roleSelect = document.getElementById('role');
  const roleBadge = document.getElementById('roleBadge');
  const roleBadgeText = document.getElementById('roleBadgeText');

  roleSelect.addEventListener('change', function() {
    if (this.value) {
      roleBadgeText.textContent = this.options[this.selectedIndex].text;
      roleBadge.classList.remove('hidden');
    } else {
      roleBadge.classList.add('hidden');
    }
  });
</script>

</body>
</html>
